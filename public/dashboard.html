<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#02050e">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>Dashboard | Pake & Scha Legal Consulting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="has-bottom-nav">
    <div class="ambient-bg"><div class="glow-orb orb-1"></div><div class="glow-orb orb-2"></div></div>

    <!-- Seitenleiste (Desktop fest, Mobil als Schublade) -->
    <aside id="sidebar" class="sidebar" aria-label="Hauptnavigation">
        <a href="/" class="brand" title="Zur Website">
            <img class="brand-logo" src="/img/monogram-44.png" srcset="/img/monogram-44.png 35w, /img/monogram-88.png 70w, /img/monogram-132.png 104w, /img/monogram-176.png 139w" sizes="35px" width="35" height="44" alt="Pake &amp; Scha" decoding="async">
            <span>
                <span class="brand-name block">Pake &amp; Scha</span>
                <span class="brand-sub block">Kanzlei-Dashboard</span>
            </span>
        </a>
        <nav id="nav" class="nav"></nav>
        <div id="userCard" class="user-card"></div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop" data-action="close-sidebar"></div>

    <div class="app-main">
        <header class="topbar glass-nav">
            <button class="icon-btn hide-desktop" data-action="open-sidebar" aria-label="Menü öffnen">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div id="pageTitle" class="topbar-title">Dashboard</div>
            <!-- Dienststatus / Stempeluhr (nur für das Team sichtbar) -->
            <div id="dutyWrap" class="pop-wrap hidden">
                <button id="dutyBtn" type="button" class="duty-btn" data-action="duty-menu" aria-haspopup="true" aria-expanded="false" title="Dienststatus">
                    <span class="duty-dot"></span><span class="lbl">Außer Dienst</span>
                </button>
                <div id="dutyPop" class="pop" role="menu"></div>
            </div>
            <a href="/" class="btn-ghost btn-sm hidden sm:inline-flex" title="Zur öffentlichen Website">
                <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
                Website
            </a>
            <a href="#mail" class="icon-btn" aria-label="Kanzlei-Post" title="Kanzlei-Post">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span id="topMailBadge" class="dot-badge hidden"></span>
            </a>
            <a href="#profile" id="topAvatar" class="avatar" aria-label="Profil" title="Profil"></a>
        </header>

        <main id="content" class="content" tabindex="-1"></main>
    </div>

    <!-- Untere Navigation (Smartphone) -->
    <nav id="bottomNav" class="bottom-nav" aria-label="Schnellnavigation"></nav>

    <!-- Dialog -->
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div id="modalCard" class="modal-card">
            <div class="modal-head">
                <button class="icon-btn modal-close" data-action="close-modal" aria-label="Schließen">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
