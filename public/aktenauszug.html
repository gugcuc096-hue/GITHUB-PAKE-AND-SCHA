<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
    <title>Aktenauszug | Pake & Scha Legal Consulting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b8962e; --ink: #0f172a; --muted: #55607a; --line: #e5e1d3; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #02050e; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: rgba(2, 5, 14, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.12); color: #f8fafc; }
        .toolbar .hint { font-size: 0.8rem; color: #8a96b3; }
        .toolbar .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
        .btn { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 999px; padding: 0.6rem 1.1rem; font: 600 0.85rem 'Inter', sans-serif; cursor: pointer; text-decoration: none; border: 1px solid rgba(212, 175, 55, 0.45); color: #f8fafc; background: rgba(255, 255, 255, 0.05); }
        .btn.gold { background: linear-gradient(135deg, #d4af37, #b8962e); color: #02050e; border: 0; }
        .opts { position: relative; }
        .opts > summary { list-style: none; }
        .opts > summary::-webkit-details-marker { display: none; }
        .opts-panel { position: absolute; right: 0; top: calc(100% + 0.5rem); width: min(92vw, 360px); max-height: 70vh; overflow: auto; padding: 0.9rem 1rem; border-radius: 14px; border: 1px solid rgba(212, 175, 55, 0.35); background: #0a1228; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55); font-size: 0.85rem; color: #e2e8f0; }
        .opts-panel h3 { margin: 0.2rem 0 0.4rem; font: 600 0.7rem 'Inter', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #d4af37; }
        .opts-panel h3:not(:first-child) { margin-top: 0.9rem; }
        .opts-panel label { display: flex; align-items: center; gap: 0.55rem; padding: 0.3rem 0; cursor: pointer; }
        .opts-panel label.sub { padding-left: 1.6rem; color: #b6c0d6; }
        .opts-panel input { width: 16px; height: 16px; accent-color: #d4af37; }
        .opts-panel .note { margin-top: 0.6rem; font-size: 0.75rem; color: #8a96b3; line-height: 1.45; }
        .wrap { padding: 1.5rem 0.75rem 3rem; }
        .paper { background: #fff; max-width: 210mm; margin: 0 auto; padding: 18mm 16mm; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); border-radius: 4px; position: relative; overflow: hidden; }
        .paper::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #d4af37, #b8962e); }
        .head { display: flex; justify-content: space-between; gap: 1.5rem; align-items: flex-start; border-bottom: 1px solid var(--line); padding-bottom: 1.25rem; }
        .brand { display: flex; gap: 0.85rem; align-items: center; }
        .mark { height: 60px; width: auto; display: block; flex-shrink: 0; }
        .firm { font: 600 1.6rem 'Cormorant Garamond', serif; line-height: 1.1; }
        .tag { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }
        .addr { font-size: 0.78rem; color: var(--muted); text-align: right; white-space: pre-line; line-height: 1.5; }
        .title { margin: 1.75rem 0 1.25rem; display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
        .title h1 { font: 600 2.1rem 'Cormorant Garamond', serif; margin: 0; letter-spacing: 0.02em; }
        .title .sub { font-size: 0.9rem; color: var(--muted); margin-top: 0.2rem; }
        .meta { display: grid; grid-template-columns: auto auto; gap: 0.15rem 1rem; font-size: 0.82rem; }
        .meta span:nth-child(odd) { color: var(--muted); }
        .meta span:nth-child(even) { font-family: 'JetBrains Mono', monospace; text-align: right; }
        .confidential { margin: -0.5rem 0 1.25rem; padding: 0.55rem 0.8rem; border: 1px solid #f1c27d; background: #fff8eb; color: #92400e; font-size: 0.78rem; border-radius: 4px; }
        section { margin-top: 1.6rem; break-inside: auto; }
        h2 { font: 600 1.3rem 'Cormorant Garamond', serif; margin: 0 0 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); break-after: avoid; }
        .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem 1.5rem; font-size: 0.86rem; }
        .facts .k { font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
        .facts .v { margin-top: 0.1rem; line-height: 1.45; }
        .text { font-size: 0.88rem; line-height: 1.6; white-space: pre-wrap; }
        .callout { background: #faf8f1; border-left: 3px solid var(--gold); padding: 0.7rem 0.9rem; font-size: 0.88rem; white-space: pre-wrap; line-height: 1.55; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { text-align: left; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); border-bottom: 1.5px solid var(--ink); padding: 0.45rem 0.4rem; font-weight: 600; }
        td { padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
        tr { break-inside: avoid; }
        .num { text-align: right; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .nowrap { white-space: nowrap; }
        .dim { color: var(--muted); }
        .pill { display: inline-block; font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.05rem 0.4rem; border-radius: 3px; border: 1px solid #d6cfb8; color: var(--muted); margin-left: 0.3rem; vertical-align: 1px; }
        .pill.int { border-color: #f1c27d; color: #92400e; background: #fff8eb; }
        .log { font-size: 0.84rem; }
        .log .entry { padding: 0.55rem 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
        .log .when { font-size: 0.72rem; color: var(--muted); }
        .log .who { font-weight: 600; }
        .log .body { white-space: pre-wrap; line-height: 1.5; margin-top: 0.15rem; }
        .log .entry.sys .body { color: var(--muted); font-style: italic; }
        .doc { padding: 0.6rem 0; border-bottom: 1px solid var(--line); break-inside: avoid; font-size: 0.84rem; }
        .doc .t { font-weight: 600; }
        .doc .transcript { margin-top: 0.4rem; padding: 0.55rem 0.7rem; background: #f7f7f5; border-radius: 3px; white-space: pre-wrap; font-size: 0.8rem; line-height: 1.5; }
        .doc a, td a { color: #8a6d1f; word-break: break-all; }
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin-top: 0.6rem; }
        .gallery figure { margin: 0; break-inside: avoid; }
        .gallery img { width: 100%; max-height: 90mm; object-fit: contain; border: 1px solid var(--line); background: #fafafa; }
        .gallery figcaption { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
        .empty { font-size: 0.84rem; color: var(--muted); font-style: italic; }
        .foot { margin-top: 2.5rem; padding-top: 0.75rem; border-top: 1px solid var(--line); font-size: 0.7rem; color: var(--muted); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .message { max-width: 560px; margin: 4rem auto; text-align: center; color: #cbd5e1; font-size: 0.95rem; }
        .message a { color: #d4af37; }
        @media (max-width: 640px) {
            .paper { padding: 10mm 6mm; }
            .head { flex-direction: column; }
            .addr { text-align: left; }
            .facts { grid-template-columns: 1fr; }
            .title h1 { font-size: 1.7rem; }
            .gallery { grid-template-columns: 1fr; }
            .hide-sm { display: none; }
            .opts { position: static; }
            .opts-panel { left: 0.75rem; right: 0.75rem; top: calc(100% + 0.25rem); width: auto; }
        }
        @page { size: A4; margin: 14mm 0 16mm; }
        @media print {
            body { background: #fff; }
            .toolbar { display: none; }
            .wrap { padding: 0; }
            .paper { box-shadow: none; border-radius: 0; max-width: none; padding: 0 16mm; overflow: visible; }
            .paper::before { display: none; }
            .hide-sm { display: table-cell; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="hint">Tipp: Im Druckdialog „Als PDF speichern“ wählen.</span>
        <div class="actions">
            <a class="btn" id="backLink" href="/dashboard.html#cases">← Dashboard</a>
            <details class="opts" id="opts">
                <summary class="btn">Inhalt wählen</summary>
                <div class="opts-panel" id="optsPanel"></div>
            </details>
            <button class="btn gold" type="button" id="printBtn">Drucken / PDF</button>
        </div>
    </div>
    <div class="wrap"><div id="doc" class="message">Aktenauszug wird erstellt …</div></div>

    <script src="/js/api.js"></script>
    <script src="/js/gdoc.js"></script>
    <script src="/js/aktenauszug.js"></script>
</body>
</html>
