<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico?v=4" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
    <title>Vertrag | Pake & Scha Legal Consulting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=Roboto+Serif:wght@400;600;700&family=Allura&family=Dancing+Script:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b8975a; --ink: #000; --muted: #666; --soft: #1a1a1a; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #02050e; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: rgba(2, 5, 14, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.12); color: #f8fafc; }
        .toolbar .hint { font-size: 0.8rem; color: #8a96b3; }
        .toolbar .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 999px; padding: 0.6rem 1.1rem; font: 600 0.85rem 'Inter', sans-serif; cursor: pointer; text-decoration: none; border: 1px solid rgba(212, 175, 55, 0.45); color: #f8fafc; background: rgba(255, 255, 255, 0.05); }
        .btn.gold { background: linear-gradient(135deg, #d4af37, #b8962e); color: #02050e; border: 0; }
        .btn.danger { border-color: rgba(248, 113, 113, 0.5); color: #fecaca; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .wrap { padding: 1.5rem 0.75rem 3rem; }
        .message { max-width: 560px; margin: 4rem auto; text-align: center; color: #cbd5e1; font-size: 0.95rem; }
        .message a { color: #d4af37; }

        /* Status- und Unterschriftsleiste (nicht im Druck) */
        .panel { max-width: 216mm; margin: 0 auto 1.25rem; padding: 1rem 1.1rem; border-radius: 14px; border: 1px solid rgba(212, 175, 55, 0.35); background: rgba(15, 23, 42, 0.85); color: #e2e8f0; font-size: 0.88rem; line-height: 1.5; }
        .panel h2 { margin: 0 0 0.35rem; font: 600 1rem 'Inter', sans-serif; color: #f3e5ab; }
        .panel .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-top: 0.7rem; }
        .panel input[type=text] { flex: 1 1 16rem; min-width: 0; padding: 0.6rem 0.8rem; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(2, 5, 14, 0.6); color: #fff; font: 500 0.95rem 'Inter', sans-serif; }
        .panel label.agree { display: flex; gap: 0.5rem; align-items: flex-start; margin-top: 0.6rem; color: #cbd5e1; }
        .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .chip { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.2); color: #cbd5e1; }
        .chip.ok { border-color: rgba(52, 211, 153, 0.5); color: #6ee7b7; background: rgba(16, 185, 129, 0.12); }
        .chip.wait { border-color: rgba(251, 191, 36, 0.5); color: #fcd34d; background: rgba(251, 191, 36, 0.1); }
        .err { color: #fca5a5; margin-top: 0.5rem; }

        /* Das Dokument – angelehnt an die Google-Docs-Vorlage der Kanzlei */
        .sheet { background: #fff; width: 216mm; max-width: 100%; min-height: 279mm; margin: 0 auto 1.25rem; padding: 12mm 25mm 20mm; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); border-radius: 3px; font-family: 'Tinos', 'Times New Roman', Times, serif; font-size: 11pt; color: var(--ink); }
        .sheet table.frame { width: 100%; border-collapse: collapse; }
        .sheet table.frame td { padding: 0; vertical-align: top; }
        .k-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; padding-bottom: 5px; border-bottom: 1px solid #9a9a9a; margin-bottom: 16mm; }
        .k-firm { font: 700 13pt/1.15 'Tinos', serif; color: var(--gold); letter-spacing: 0.02em; }
        .k-addr { font: 700 10pt/1.35 'Tinos', serif; color: var(--muted); text-align: left; min-width: 30mm; }
        .k-title { font: 700 30pt/1.2 'Tinos', serif; color: var(--gold); text-align: center; margin: 24mm 0 10mm; }
        .k-section { font: 700 17pt/1.3 'Tinos', serif; color: var(--gold); text-align: center; margin: 8mm 0 7mm; }
        .k-para { font: 700 11pt/1.4 'Tinos', serif; color: var(--soft); margin: 7mm 0 3mm; }
        .k-p { margin: 0 0 2mm; line-height: 2; color: var(--soft); text-align: justify; }
        .k-center { font-family: 'Roboto Serif', serif; font-size: 9.5pt; text-align: center; margin: 0; line-height: 1.55; }
        .k-center strong { font-weight: 600; font-size: 11pt; }
        .k-center.k-between { font-size: 15pt; color: var(--muted); margin: 2mm 0; }
        .k-gap { height: 9mm; }
        .k-space { height: 3mm; }
        .k-item { display: grid; grid-template-columns: 7mm 1fr; margin: 0 0 1mm; line-height: 2; color: var(--soft); }
        .k-num { font-weight: 700; }
        .k-indent { margin: 0 0 1mm 14mm; line-height: 2; color: var(--muted); }
        .k-indent em { font-style: italic; }
        .k-val { font-weight: inherit; }
        .k-blank { display: inline-block; min-width: 38mm; border-bottom: 1px solid #444; height: 1em; vertical-align: baseline; }
        .k-unknown { background: #fee2e2; color: #991b1b; padding: 0 2px; }
        .k-signplace { font-family: 'Roboto Serif', serif; font-size: 10.5pt; margin: 10mm 0 16mm; }
        .k-signplace strong { font-weight: 700; }
        .k-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 16mm; }
        .k-script { height: 15mm; display: flex; align-items: flex-end; font-size: 23pt; line-height: 1; padding: 0 2mm 1mm; white-space: nowrap; overflow: visible; }
        .k-script.lawyer { font-family: 'Allura', cursive; color: #0000ff; font-size: 26pt; }
        .k-script.client { font-family: 'Dancing Script', cursive; color: #000; }
        .k-line { border-top: 1px solid #333; }
        .k-sname { font: 600 10.5pt 'Roboto Serif', serif; margin-top: 2mm; }
        .k-srole { font: 400 9pt 'Roboto Serif', serif; color: var(--muted); }
        .k-snote { font: 400 8pt 'Inter', sans-serif; color: #888; margin-top: 1.5mm; }
        /* Bestätigungsdialog (wie im Dashboard, aus app.css übernommen) */
        :root { --gold-500: #d4af37; --gold-hairline: rgba(212, 175, 55, 0.35); --text-main: #f8fafc; --text-muted: #cbd5e1; }
        .ps-dialog-root { position: fixed; inset: 0; z-index: 85; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(2, 5, 14, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.16s ease; }
        .ps-dialog-root.open { opacity: 1; }
        .ps-dialog { width: 100%; max-width: 440px; text-align: center; padding: 1.75rem 1.5rem 1.4rem; border-radius: 22px; border: 1px solid var(--gold-hairline); border-top: 2px solid var(--gold-500); background: linear-gradient(180deg, rgba(14, 22, 46, 0.98), rgba(6, 11, 25, 0.98)); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03) inset; transform: translateY(8px) scale(0.98); transition: transform 0.16s ease; }
        .ps-dialog-root.open .ps-dialog { transform: none; }
        .ps-dialog.is-danger { border-top-color: #ef4444; }
        .ps-dialog-mark { width: 56px; height: 56px; margin: 0 auto 0.9rem; border-radius: 16px; overflow: hidden; border: 1px solid var(--gold-hairline); box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15); }
        .ps-dialog-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ps-dialog-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.6rem; font-weight: 600; line-height: 1.2; color: var(--text-main); }
        .ps-dialog-text { margin-top: 0.6rem; font-size: 0.92rem; line-height: 1.55; color: var(--text-muted); white-space: pre-line; word-break: break-word; }
        .ps-dialog-actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap-reverse; margin-top: 1.4rem; }
        .ps-dialog-actions > * { min-width: 8.5rem; }
        @media (max-width: 480px) { .ps-dialog-actions > * { flex: 1 1 100%; } }
        body.ps-dialog-open { overflow: hidden; }
        .ps-dialog button { border-radius: 999px; padding: 0.65rem 1.2rem; font: 600 0.88rem 'Inter', sans-serif; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.05); color: #f8fafc; }
        .ps-dialog .btn-gold { background: linear-gradient(135deg, #d4af37, #b8962e); color: #02050e; border: 0; }
        .ps-dialog .btn-danger { background: #b91c1c; border: 0; color: #fff; }
        .preview-note { max-width: 216mm; margin: 0 auto 1rem; color: #fcd34d; font-size: 0.85rem; }

        @media screen and (max-width: 820px) {
            .sheet { padding: 8mm 7mm 12mm; min-height: 0; font-size: 10.5pt; }
            .k-title { font-size: 24pt; margin: 10mm 0 8mm; }
            .k-signs { grid-template-columns: 1fr; gap: 10mm; }
            .k-head { margin-bottom: 9mm; }
        }
        @page { size: letter; margin: 12mm 25mm 16mm; }
        @media print {
            body { background: #fff; }
            .toolbar, .panel, .preview-note { display: none !important; }
            .wrap { padding: 0; }
            .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; border-radius: 0; break-after: page; }
            .sheet:last-child { break-after: auto; }
            /* Kopfzeile wiederholt sich auf jeder gedruckten Seite (thead) */
            .sheet table.frame thead { display: table-header-group; }
            .k-head { margin-bottom: 12mm; }
            .k-item, .k-p, .k-indent, .k-signs-wrap { break-inside: avoid; }
            .k-para, .k-section { break-after: avoid; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="hint">Tipp: Im Druckdialog „Als PDF speichern“ wählen.</span>
        <div class="actions">
            <a class="btn" id="backLink" href="/dashboard.html#cases">← Zur Akte</a>
            <button class="btn gold" type="button" onclick="window.print()">Drucken / PDF</button>
        </div>
    </div>
    <div class="wrap"><div id="panel"></div><div id="doc" class="message">Vertrag wird geladen …</div></div>

    <script src="/js/api.js"></script>
    <script src="/js/contract-render.js"></script>
    <script>
    (() => {
        'use strict';
        const { api, esc, parseDate } = window.PS;
        const { render, header } = window.PS.contract;
        const params = new URLSearchParams(location.search);
        const id = Number(params.get('id'));
        const templateId = Number(params.get('vorlage'));
        const root = document.getElementById('doc');
        const panel = document.getElementById('panel');
        let state = null;

        const sheets = (pages, head) =>
            pages.map((html) => `<article class="sheet"><table class="frame"><thead><tr><td>${head}</td></tr></thead><tbody><tr><td>${html}</td></tr></tbody></table></article>`).join('');
        const dateTime = (v) => { const d = parseDate(v); return d ? d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; };

        function values(k, c) {
            return { ...k.data, aktenzeichen: c.caseNumber, akte: c.title, rechtsgebiet: c.area, kanzlei: 'Pake & Scha Legal Consulting' };
        }

        function renderPanel() {
            const { contract: k, can } = state;
            const chips = [
                k.lawyerSignedAt ? `<span class="chip ok">✓ Anwalt: ${esc(k.lawyerSignature)} · ${esc(dateTime(k.lawyerSignedAt))}</span>` : `<span class="chip wait">Anwalt: noch nicht unterschrieben (${esc(k.lawyerName || '—')})</span>`,
                k.clientSignedAt
                    ? `<span class="chip ok">✓ Mandant: ${esc(k.clientSignature)} · ${k.clientSignedVia === 'kanzlei' ? 'im Spiel, erfasst' : 'digital'} · ${esc(dateTime(k.clientSignedAt))}</span>`
                    : '<span class="chip wait">Mandant: noch nicht unterschrieben</span>',
            ].join('');
            const parts = [];
            if (can.canSignClient) {
                parts.push(`<h2>Vertrag unterschreiben</h2>
                    <div>Bitte lesen Sie den Vertrag vollständig. Zum Unterschreiben tippen Sie Ihren vollständigen Namen${k.data.mandant ? ` (<strong>${esc(k.data.mandant)}</strong>)` : ''} ein.</div>
                    <label class="agree"><input type="checkbox" id="agree"> Ich habe den Mandatsvertrag gelesen und bin mit allen Bedingungen einverstanden.</label>
                    <div class="row"><input type="text" id="signName" maxlength="120" autocomplete="name" placeholder="Vollständiger Name"><button class="btn gold" id="signClient" type="button">Unterschreiben</button></div>`);
            }
            if (can.canSignLawyer) parts.push(`<div class="row"><button class="btn gold" id="signLawyer" type="button">Als Anwalt unterschreiben</button><span>Ihre Unterschrift erscheint als ${esc(k.lawyerName || '')} im Unterschriftsfeld.</span></div>`);
            if (can.canRecordClient) parts.push('<div class="row"><button class="btn" id="recordClient" type="button">Mandant hat im Spiel unterschrieben – erfassen</button></div>');
            if (can.canReset) parts.push('<div class="row"><button class="btn danger" id="resetSigs" type="button">Unterschriften zurücksetzen</button><span class="hint">Nur Kanzleileitung</span></div>');
            panel.innerHTML = `<div class="panel"><div class="chips">${chips}</div>${parts.join('')}<div class="err" id="panelErr" hidden></div></div>`;
            const err = (e) => { const el = document.getElementById('panelErr'); el.hidden = false; el.textContent = e.message || String(e); };
            const sign = async (body, btn) => {
                btn.disabled = true;
                try {
                    const r = await api.post(`/api/contracts/${k.id}/sign`, body);
                    state.contract = r.contract;
                    state.can = r.can;
                    draw();
                } catch (e) { btn.disabled = false; err(e); }
            };
            document.getElementById('signClient')?.addEventListener('click', (ev) => {
                if (!document.getElementById('agree').checked) return err(new Error('Bitte bestätigen Sie, dass Sie den Vertrag gelesen haben.'));
                sign({ as: 'mandant', name: document.getElementById('signName').value }, ev.currentTarget);
            });
            document.getElementById('signLawyer')?.addEventListener('click', async (ev) => {
                const btn = ev.currentTarget;
                if (await window.PS.confirm('Danach lässt sich der Vertragsinhalt nicht mehr ändern.', { title: 'Als Anwalt unterschreiben?', confirmText: 'Unterschreiben' })) sign({ as: 'anwalt' }, btn);
            });
            document.getElementById('recordClient')?.addEventListener('click', async (ev) => {
                const btn = ev.currentTarget;
                if (await window.PS.confirm(`Bitte nur bestätigen, wenn ${k.data.mandant || 'der Mandant'} den Vertrag im Spiel tatsächlich unterschrieben hat. Die Erfassung wird mit Ihrem Namen im Aktenverlauf vermerkt.`, { title: 'Unterschrift des Mandanten erfassen?', confirmText: 'Erfassen' })) sign({ as: 'erfassen' }, btn);
            });
            document.getElementById('resetSigs')?.addEventListener('click', async (ev) => {
                const btn = ev.currentTarget;
                if (!(await window.PS.confirm('Beide Unterschriften werden entfernt; der Vertrag kann danach wieder bearbeitet werden.', { title: 'Unterschriften zurücksetzen?', confirmText: 'Zurücksetzen', danger: true }))) return;
                btn.disabled = true;
                try {
                    const r = await api.post(`/api/contracts/${k.id}/reset`, {});
                    state.contract = r.contract;
                    state.can = r.can;
                    draw();
                } catch (e) { btn.disabled = false; err(e); }
            });
        }

        function draw() {
            const { contract: k, case: c } = state;
            document.title = `${k.templateName} ${c.caseNumber} | Pake & Scha`;
            document.getElementById('backLink').href = `/dashboard.html?case=${c.id}#cases`;
            root.className = '';
            root.innerHTML = sheets(render(k.body, values(k, c), k), header(state.header));
            renderPanel();
            if (params.get('print') === '1') setTimeout(() => window.print(), 500);
        }

        function fail(err, back = '/dashboard.html#cases') {
            if (err.status === 401) {
                location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
                return;
            }
            root.className = 'message';
            root.innerHTML = `${esc(err.message)}<br><br><a href="${back}">Zum Dashboard</a>`;
        }

        if (Number.isInteger(templateId) && templateId > 0) {
            // Vorschau einer Vorlage (Einstellungen): Felder bleiben leer bzw. zeigen Beispielwerte.
            api.get('/api/contract-templates?all=1')
                .then(({ templates, header: head }) => {
                    const t = templates.find((x) => x.id === templateId);
                    if (!t) throw Object.assign(new Error('Vorlage nicht gefunden.'), { status: 404 });
                    const sample = params.get('beispiel') === '1'
                        ? { anwalt: 'Dr. Alois Pake', anwalt_rang: 'Founding Partner', anwalt_geburtsdatum: '12.03.1988', mandant: 'John Doe', mandant_geburtsdatum: '04.07.1995', leistungen: '• Vertretung Hauptverhandlung (alle Gerichte) – 100.000 $\n• U-Haft-Vertretung vor Ort – 50.000 $', grundgebuehr: '150.000 $', zusatzgebuehr: '25.000 $ je weiterem Verhandlungstag', datum: new Date().toLocaleDateString('de-DE'), ort: 'Los Santos, San Andreas', aktenzeichen: 'PS-2026-0001', akte: 'Beispielakte', rechtsgebiet: 'Strafrecht', kanzlei: 'Pake & Scha Legal Consulting' }
                        : { aktenzeichen: '', akte: '', rechtsgebiet: '', kanzlei: 'Pake & Scha Legal Consulting', anwalt: '', anwalt_rang: '', anwalt_geburtsdatum: '', mandant: '', mandant_geburtsdatum: '', leistungen: '', grundgebuehr: '', zusatzgebuehr: '', datum: '', ort: '' };
                    document.title = `Vorschau: ${t.name} | Pake & Scha`;
                    document.getElementById('backLink').href = '/dashboard.html#settings';
                    document.getElementById('backLink').textContent = '← Einstellungen';
                    panel.innerHTML = `<p class="preview-note">Vorschau der Vorlage „${esc(t.name)}“ – ${params.get('beispiel') === '1' ? 'mit Beispielwerten' : 'leere Felder erscheinen als Linie zum Ausfüllen'}.</p>`;
                    root.className = '';
                    root.innerHTML = sheets(render(t.body, sample, null), header(head));
                })
                .catch((e) => fail(e, '/dashboard.html#settings'));
        } else if (!Number.isInteger(id) || id <= 0) {
            root.innerHTML = 'Kein Vertrag angegeben. <a href="/dashboard.html#cases">Zum Dashboard</a>';
        } else {
            api.get('/api/contracts/' + id)
                .then((r) => {
                    state = r;
                    draw();
                })
                .catch((e) => fail(e));
        }
    })();
    </script>
</body>
</html>
